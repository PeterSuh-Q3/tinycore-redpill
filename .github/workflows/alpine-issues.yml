name: Alpine - Issues

permissions:
  contents: read
  issues: write

on:
  issues:
    types: [opened, reopened]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init Env
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Seoul"

      - name: Check Issues
        shell: python
        run: |
          # -*- coding: utf-8 -*-
          import json
          import os
          import re

          def set_env(name, value):
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
                  f.write(f"{name}={value}\n")

          def set_multiline_env(name, value):
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
                  f.write(f"{name}<<EOF\n{value}\nEOF\n")

          issuetitle = ${{ toJSON(github.event.issue.title) }};
          issuebody = ${{ toJSON(github.event.issue.body) }};

          json_error_message = ""
          json_error = "false"
          iscustom = "false"
          warinfo = "false"
          model = ""
          version = ""
          mac1 = ""
          mac2 = ""
          mac3 = ""
          mac4 = ""
          mac5 = ""
          mac6 = ""
          mac7 = ""
          mac8 = ""
          sn = ""
          format = ""
          language = ""

          try:
              if issuetitle.lower().startswith("custom") and not re.search(r"^### Model\s*$", issuebody, re.MULTILINE):
                  jsonbody = json.loads(issuebody)
                  iscustom = "true"
                  model = jsonbody.get("model", "")
                  version = jsonbody.get("version", "")
                  mac1 = jsonbody.get("mac1", "")
                  mac2 = jsonbody.get("mac2", "")
                  mac3 = jsonbody.get("mac3", "")
                  mac4 = jsonbody.get("mac4", "")
                  mac5 = jsonbody.get("mac5", "")
                  mac6 = jsonbody.get("mac6", "")
                  mac7 = jsonbody.get("mac7", "")
                  mac8 = jsonbody.get("mac8", "")
                  sn = jsonbody.get("sn", "")
                  format = jsonbody.get("format", "")
                  language = jsonbody.get("language", "")

              elif re.search(r"^### Model\s*$", issuebody, re.MULTILINE):
                  def form_value(label):
                      match = re.search(rf"^### {re.escape(label)}\s*\n\n(.+?)(?=\n\n### |\Z)", issuebody, re.MULTILINE | re.DOTALL)
                      value = match.group(1).strip() if match else ""
                      return "" if value == "_No response_" else value

                  iscustom = "true"
                  model = form_value("Model")
                  version = form_value("DSM version")
                  mac1 = form_value("MAC address 1")
                  mac2 = form_value("MAC address 2")
                  mac3 = form_value("MAC address 3")
                  mac4 = form_value("MAC address 4")
                  sn = form_value("Serial number")
                  format = form_value("Output format")
                  language = form_value("Language")

          except json.JSONDecodeError as e:
              json_error = "true"
              iscustom = "false"
              json_error_message = (
                  "There is a syntax error in the submitted JSON body.\n"
                  f"- Error Location: Line {e.lineno}, Column {e.colno}\n"
                  f"- Error Reason: {e.msg}\n\n"
                  "Please check for missing commas (,) or mismatched quotes (\") and resubmit the issue."
              )

          except ValueError:
              pass

          if iscustom == "true":
              with open("models.json", encoding="utf-8") as f:
                  platforms = json.load(f)
              supported_models = {item for platform in platforms.values() for item in platform["models"]}
              supported_majors = {
                  major for platform in platforms.values() if model in platform["models"]
                  for major in platform["productvers"]
              }
              errors = []
              if model not in supported_models:
                  errors.append(f"Unsupported model: {model or '(empty)'}")
              if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+-[0-9]+", version or ""):
                  errors.append("DSM version must use the form X.Y.Z-build, for example 7.4.1-90080.")
              elif ".".join(version.split("-")[0].split(".")[:2]) not in supported_majors:
                  errors.append(f"DSM {version.split('.')[0]}.{version.split('.')[1]} is not supported by {model}.")
              if format not in ("", "img", "vmdk", "both"):
                  errors.append("Output format must be img, vmdk, or both.")
              for index, mac in enumerate((mac1, mac2, mac3, mac4, mac5, mac6, mac7, mac8), start=1):
                  if mac and not re.fullmatch(r"[0-9A-Fa-f]{12}", mac):
                      errors.append(f"MAC address {index} must contain exactly 12 hexadecimal characters.")
              supplied_macs = [mac.lower() for mac in (mac1, mac2, mac3, mac4, mac5, mac6, mac7, mac8) if mac]
              if len(supplied_macs) != len(set(supplied_macs)):
                  errors.append("MAC addresses must not be duplicated.")
              if sn and not re.fullmatch(r"[A-Za-z0-9]{1,32}", sn):
                  errors.append("Serial number may contain only letters and numbers (maximum 32 characters).")
              if language and not re.fullmatch(r"[A-Za-z_]{2,16}", language):
                  errors.append("Language must contain only letters and underscores.")
              if errors:
                  json_error = "true"
                  iscustom = "false"
                  json_error_message = "\n".join(f"- {error}" for error in errors)

          if iscustom == "false" and json_error == "false":
              if issuebody.find("DMI") < 0 and issuebody.find("CPU") < 0 and issuebody.find("NIC") < 0:
                  warinfo = "true"

          set_env("iscustom", iscustom)
          set_env("warinfo", warinfo)
          set_env("json_error", json_error)

          set_env("model", model)
          set_env("version", version)
          set_env("mac1", mac1)
          set_env("mac2", mac2)
          set_env("mac3", mac3)
          set_env("mac4", mac4)
          set_env("mac5", mac5)
          set_env("mac6", mac6)
          set_env("mac7", mac7)
          set_env("mac8", mac8)
          set_env("sn", sn)
          set_env("format", format)
          set_env("language", language)

          if json_error_message:
              set_multiline_env("JSON_ERROR_MESSAGE", json_error_message)

      - name: Check existing JSON error comment
        if: env.json_error == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]") | .body' \
            | grep -Fq '<!-- workflow:json-error -->'; then
            echo "JSON_ERROR_COMMENT_EXISTS=true" >> $GITHUB_ENV
          else
            echo "JSON_ERROR_COMMENT_EXISTS=false" >> $GITHUB_ENV
          fi

      - name: Comment JSON syntax error
        if: env.json_error == 'true' && env.JSON_ERROR_COMMENT_EXISTS != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body "$(cat <<'EOF'
          <!-- workflow:json-error -->
          Hi @${{ github.event.issue.user.login }}.

          Your custom loader request contains invalid input.

          ${{ env.JSON_ERROR_MESSAGE }}
          EOF
          )"

      - name: Fail on invalid input
        if: env.json_error == 'true'
        run: |
          echo "Invalid JSON detected in issue body."
          exit 1

      - name: Add issue labels
        if: env.iscustom == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL_LABEL: ${{ env.model }}
        run: |
          if [ -n "$MODEL_LABEL" ] && ! gh label list \
            --repo "${{ github.repository }}" \
            --search "$MODEL_LABEL" \
            --limit 1000 \
            --json name \
            --jq '.[].name' | grep -Fxq "$MODEL_LABEL"; then
            gh label create "$MODEL_LABEL" \
              --repo "${{ github.repository }}" \
              --color "0E8A16" \
              --description "Custom loader build for $MODEL_LABEL"
          fi

          gh issue edit ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --add-label "custom"

          if [ -n "$MODEL_LABEL" ]; then
            gh issue edit ${{ github.event.issue.number }} \
              --repo "${{ github.repository }}" \
              --add-label "$MODEL_LABEL"
          fi

      - name: build tinycore-redpill loader with lastest img
        id: build-loader
        if: env.iscustom == 'true'
        run: |
          path=`pwd`
          userconfigfile="/home/tc/user_config.json"

          sudo apt-get update
          sudo apt-get install grub2 pciutils qemu-utils cpio kmod ncurses-bin jq

          sudo mkdir /home/tc
          sudo mkdir /opt/output
          sudo cp -rf ./* /home/tc
          sudo chmod +x /home/tc/writekey.sh
          ls -ltr /home/tc

          RELEASE_JSON="$(curl --fail --silent --show-error --connect-timeout 5 --location "https://api.github.com/repos/PeterSuh-Q3/tinycore-redpill/releases/latest")"
          TAG="$(printf '%s' "$RELEASE_JSON" | jq -r '.tag_name')"
          if [ -z "${TAG}" ] || [ "${TAG}" = "null" ]; then
            echo "Failed to resolve latest release tag."
            exit 1
          fi
          IMAGE_URL="$(printf '%s' "$RELEASE_JSON" | jq -r '.assets[] | select(.name | endswith(".m-shell.img.gz")) | .browser_download_url' | head -n 1)"
          if [ -z "${IMAGE_URL}" ] || [ "${IMAGE_URL}" = "null" ]; then
            echo "Failed to find an m-shell image asset in release ${TAG}."
            exit 1
          fi
          echo "TAG is ${TAG}"
          echo "Downloading ${IMAGE_URL}"
          curl --fail --location --show-error --retry 3 -o base-m-shell.img.gz "$IMAGE_URL"
          gunzip base-m-shell.img.gz
          pwd
          ls -ltr
          echo "TAG=${TAG}" >> $GITHUB_OUTPUT

          LOOPX=$(sudo losetup -f)
          sudo losetup -P ${LOOPX} base-m-shell.img
          sudo fdisk -l ${LOOPX}

          loaderdisk=$(echo ${LOOPX} | cut -c 6-12 )

          sudo mkdir -p /mnt/${loaderdisk}p1
          sudo mkdir -p /mnt/${loaderdisk}p2
          sudo mkdir -p /mnt/${loaderdisk}p3

          sudo mount ${LOOPX}p1 /mnt/${loaderdisk}p1
          sudo mount ${LOOPX}p2 /mnt/${loaderdisk}p2
          sudo mount ${LOOPX}p3 /mnt/${loaderdisk}p3

          ls -ltr /mnt/${loaderdisk}p1
          ls -ltr /mnt/${loaderdisk}p2
          ls -ltr /mnt/${loaderdisk}p3

          cd /home/tc
          if [ -n "${{ env.mac1 }}" ]; then
            echo "set mac1: ${{ env.mac1 }}"
            sudo ./writekey.sh "extra_cmdline" "mac1" "${{ env.mac1 }}" $userconfigfile
            sudo ./writekey.sh "extra_cmdline" "netif_num" "1" $userconfigfile
          fi
          if [ -n "${{ env.mac2 }}" ]; then
            echo "set mac2: ${{ env.mac2 }}"
            sudo ./writekey.sh "extra_cmdline" "mac2" "${{ env.mac2 }}" $userconfigfile
            sudo ./writekey.sh "extra_cmdline" "netif_num" "2" $userconfigfile
          fi
          if [ -n "${{ env.mac3 }}" ]; then
            echo "set mac3: ${{ env.mac3 }}"
            sudo ./writekey.sh "extra_cmdline" "mac3" "${{ env.mac3 }}" $userconfigfile
            sudo ./writekey.sh "extra_cmdline" "netif_num" "3" $userconfigfile
          fi
          if [ -n "${{ env.mac4 }}" ]; then
            echo "set mac4: ${{ env.mac4 }}"
            sudo ./writekey.sh "extra_cmdline" "mac4" "${{ env.mac4 }}" $userconfigfile
            sudo ./writekey.sh "extra_cmdline" "netif_num" "4" $userconfigfile
          fi
          if [ -n "${{ env.mac5 }}" ]; then
            echo "set mac5: ${{ env.mac5 }}"
            sudo ./writekey.sh "extra_cmdline" "mac5" "${{ env.mac5 }}" $userconfigfile
            sudo ./writekey.sh "extra_cmdline" "netif_num" "5" $userconfigfile
          fi
          if [ -n "${{ env.mac6 }}" ]; then
            echo "set mac6: ${{ env.mac6 }}"
            sudo ./writekey.sh "extra_cmdline" "mac6" "${{ env.mac6 }}" $userconfigfile
            sudo ./writekey.sh "extra_cmdline" "netif_num" "6" $userconfigfile
          fi
          if [ -n "${{ env.mac7 }}" ]; then
            echo "set mac7: ${{ env.mac7 }}"
            sudo ./writekey.sh "extra_cmdline" "mac7" "${{ env.mac7 }}" $userconfigfile
            sudo ./writekey.sh "extra_cmdline" "netif_num" "7" $userconfigfile
          fi
          if [ -n "${{ env.mac8 }}" ]; then
            echo "set mac8: ${{ env.mac8 }}"
            sudo ./writekey.sh "extra_cmdline" "mac8" "${{ env.mac8 }}" $userconfigfile
            sudo ./writekey.sh "extra_cmdline" "netif_num" "8" $userconfigfile
          fi

          if [ -n "${{ env.sn }}" ]; then
            echo "set sn: ${{ env.sn }}"
            sudo ./writekey.sh "extra_cmdline" "sn" "${{ env.sn }}" $userconfigfile
          fi
          if [ -n "${{ env.language }}" ]; then
            echo "set language: ${{ env.language }}"
            sudo ./writekey.sh "general" "ucode" "${{ env.language }}" $userconfigfile
          fi
          if [ -n "${{ env.version }}" ]; then
            echo "set version: ${{ env.version }}"
            sudo ./writekey.sh "general" "version" "${{ env.version }}" $userconfigfile
          fi

          echo "Build loader for ${{ env.model }}-${{ env.version }}"
          ls -ltr ./functions.sh
          sudo ./functions.sh my ${{ env.model }}-${{ env.version }} noconfig fri
          sudo cat /home/tc/user_config.json

          ls -ltr /mnt/${loaderdisk}p1
          ls -ltr /mnt/${loaderdisk}p2
          ls -ltr /mnt/${loaderdisk}p3

          cd ${path}/
          dd if=/dev/zero of=tinycore-redpill.${TAG}-${{ env.model }}-${{ env.version }}.m-shell.img bs=1M seek=2048 count=0
          echo -e "n\np\n1\n\n+72M\nn\np\n2\n\n+75M\nn\np\n3\n\n+1626M\nw\nq\n" | sudo fdisk tinycore-redpill.${TAG}-${{ env.model }}-${{ env.version }}.m-shell.img
          echo -e "a\n1\nw" | sudo fdisk tinycore-redpill.${TAG}-${{ env.model }}-${{ env.version }}.m-shell.img

          LOOPZ=$(sudo losetup -f)
          sudo losetup -P ${LOOPZ} tinycore-redpill.${TAG}-${{ env.model }}-${{ env.version }}.m-shell.img
          echo "LOOPZ = ${LOOPZ}"
          sudo fdisk -l ${LOOPZ}

          sudo mkfs.vfat -i 6234C863 -F16 ${LOOPZ}p3

          sudo dd if="${LOOPX}p1" of="${LOOPZ}p1"
          sudo mkdir -p /mnt/tarp1
          sudo mount ${LOOPZ}p1 /mnt/tarp1
          sudo grub-install --target=x86_64-efi --boot-directory="/mnt/tarp1/boot" --efi-directory="/mnt/tarp1" --removable
          sudo grub-install --target=i386-pc --boot-directory="/mnt/tarp1/boot" "${LOOPZ}"

          sudo dd if="${LOOPX}p2" of="${LOOPZ}p2"

          sudo mkdir -p /mnt/tarp3
          sudo mount ${LOOPZ}p3 /mnt/tarp3
          cd /mnt/${loaderdisk}p3 && sudo find . | sudo cpio -pdm "/mnt/tarp3"
          cd ${path}/
          ls -ltr /mnt/tarp3

          sudo umount /mnt/tarp3

          sudo losetup -d ${LOOPZ}
          sudo umount /mnt/${loaderdisk}p1
          sudo umount /mnt/${loaderdisk}p2
          sudo umount /mnt/${loaderdisk}p3
          sudo losetup -d ${LOOPX}

          cd ${path}/
          ls -ltr ${path}/

          if [ -z "${{ env.format }}" ]; then
            gzip -c tinycore-redpill.${TAG}-${{ env.model }}-${{ env.version }}.m-shell.img > /opt/output/tinycore-redpill.${TAG}-${{ env.model }}-${{ env.version }}.m-shell.img.gz
            qemu-img convert -f raw -O vmdk tinycore-redpill.${TAG}-${{ env.model }}-${{ env.version }}.m-shell.img tinycore-redpill.${TAG}-${{ env.model }}-${{ env.version }}.m-shell.vmdk
            gzip -c tinycore-redpill.${TAG}-${{ env.model }}-${{ env.version }}.m-shell.vmdk > /opt/output/tinycore-redpill.${TAG}-${{ env.model }}-${{ env.version }}.m-shell.vmdk.gz
          else
            if [ "${{ env.format }}" = "img" ]; then
              gzip -c tinycore-redpill.${TAG}-${{ env.model }}-${{ env.version }}.m-shell.img > /opt/output/tinycore-redpill.${TAG}-${{ env.model }}-${{ env.version }}.m-shell.img.gz
            fi

            if [ "${{ env.format }}" = "vmdk" ]; then
              qemu-img convert -f raw -O vmdk tinycore-redpill.${TAG}-${{ env.model }}-${{ env.version }}.m-shell.img tinycore-redpill.${TAG}-${{ env.model }}-${{ env.version }}.m-shell.vmdk
              gzip -c tinycore-redpill.${TAG}-${{ env.model }}-${{ env.version }}.m-shell.vmdk > /opt/output/tinycore-redpill.${TAG}-${{ env.model }}-${{ env.version }}.m-shell.vmdk.gz
            fi
          fi

          ls -ltr /opt/output

      - name: Upload to Artifact
        if: env.iscustom == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: MshellImage-${{ steps.build-loader.outputs.TAG }}-${{ env.model }}-${{ env.version }}
          path: /opt/output

      - name: Check existing success comment
        if: env.iscustom == 'true' && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]") | .body' \
            | grep -Fq '<!-- workflow:build-success -->'; then
            echo "SUCCESS_COMMENT_EXISTS=true" >> $GITHUB_ENV
          else
            echo "SUCCESS_COMMENT_EXISTS=false" >> $GITHUB_ENV
          fi

      - name: Comment build success
        if: env.iscustom == 'true' && success() && env.SUCCESS_COMMENT_EXISTS != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body "$(cat <<'EOF'
          <!-- workflow:build-success -->
          Hi @${{ github.event.issue.user.login }}.

          MSHELL-${{ env.model }} build success, please download the attachment from the link below (attachments are only kept for 5 days).

          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )"

      - name: Close issue
        if: env.iscustom == 'true' && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue close ${{ github.event.issue.number }} \
            --repo ${{ github.repository }}

          #done
          #echo "make po end"
          
          echo "Convert po2mo begin"
          DEST_PATH="${ROOT_PATH}/lang"
          echo "${DEST_PATH}"
          # Bash double-quoted gettext keys keep '\\n' as two literal
          # characters. A single \\n in a PO body is decoded as a real
          # newline by msgfmt, so the key no longer matches and gettext
          # silently falls back to English. PO message bodies must use
          # literal \\\\n only; reject every bare \\n before compilation.
          echo "Validate PO newline escapes"
          po_escape_error=0
          for P in $(ls ${DEST_PATH}/*/LC_MESSAGES/tcrp.po 2>/dev/null); do
            if ! perl -0777 -ne '
              s/\A.*?\n\n//s;
              if (/(?<!\\)\\n/) {
                print "$ARGV: bare \\n escape is not allowed in PO message bodies\n";
                exit 1;
              }
            ' "${P}"; then
              po_escape_error=1
            fi
          done
          [ "${po_escape_error}" -eq 0 ] || exit 1
          for P in $(ls ${DEST_PATH}/*/LC_MESSAGES/tcrp.po 2>/dev/null); do
            # Use msgfmt command to compile the .po file into a binary .mo file
            echo "msgfmt ${P} to ${P/.po/.mo}"
            msgfmt ${P} -o ${P/.po/.mo}
          done
          echo "Convert po2mo end"
          
          ls -lrt ${DEST_PATH}/*/LC_MESSAGES/
          tar -zcvf lang.tgz -C ${DEST_PATH} .          
      - name: Commit and push changes
        run: |
          git add .
          git commit -a -m "upload .po .mo"
          git push            
